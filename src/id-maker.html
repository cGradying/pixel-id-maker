scene.addEventListener('pointerdown', e => { if (S.mode3d !== 'drag') return; scene.setPointerCapture(e.pointerId); dragR = { x: e.clientX, y: e.clientY, rx: hov.rx, ry: hov.ry }; });
scene.addEventListener('pointerup', () => { dragR = null; });
scene.addEventListener('pointerleave', () => { if (S.mode3d === 'hover') { hov.rx = 0; hov.ry = 0; } });
function reset3d() { hov.rx = hov.ry = 0; spinA = 0; cur.rx = cur.ry = 0; ['rotX', 'rotY'].forEach(k => setS(k, 0)); setS('zoom', 100); setS('persp', 1300); setS('tiltAmt', 100); }

/* design-view drag */
let drag = null; const flat = $('flat');
flat.onpointerdown = e => { if (S.side === 'back') { if (!S.job || ownBack) return; flat.setPointerCapture(e.pointerId); drag = { back: true, x: e.clientX, y: e.clientY, px: S.jobX, py: S.jobY }; flat.style.cursor = 'grabbing'; return; } if (ownFront) return; flat.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, px: S.px, py: S.py }; flat.style.cursor = 'grabbing'; };
flat.onpointermove = e => { if (!drag) return; const r = flat.getBoundingClientRect(); if (drag.back) { setS('jobX', +(drag.px + (e.clientX - drag.x) / r.width * 24).toFixed(1)); setS('jobY', +(drag.py + (e.clientY - drag.y) / r.height * 38).toFixed(1)); schedule(); return; } setS('px', +(drag.px + (e.clientX - drag.x) / r.width * 100).toFixed(1)); setS('py', +(drag.py + (e.clientY - drag.y) / r.height * 100).toFixed(1)); schedule(true); };
flat.onpointerup = () => { drag = null; flat.style.cursor = 'grab'; };

/* toolbar */
document.querySelectorAll('#segView button').forEach(b => b.onclick = () => { S.view = b.dataset.v; update(1.5); });
document.querySelectorAll('#segSide button').forEach(b => b.onclick = () => { S.side = b.dataset.s; if (S.view === '3d') { if (S.mode3d !== 'spin') { spinA = 0; hov.ry = Math.round(hov.ry / 360) * 360; } document.querySelectorAll('#segSide button').forEach(x => x.classList.toggle('on', x.dataset.s === S.side)); } else update(PSC); });
document.querySelectorAll('#segMat button').forEach(b => b.onclick = () => { S.mat = b.dataset.m; ctl.mat && ctl.mat.set(S.mat); update(1.5); });

/* ---------------- handlers ---------------- */
function trimImg(im) {
  const c = mk(im.width, im.height), x = c.getContext('2d'); x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data; let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) for (let i = 0; i < c.width; i++) { const o = (y * c.width + i) * 4;
    if (d[o + 3] > 24 && !(d[o] > 242 && d[o + 1] > 242 && d[o + 2] > 242)) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
  if (x1 < 0) return c;
  const o = mk(x1 - x0 + 1, y1 - y0 + 1); o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height); return o;
}
function toCv(im, cap) { const k = Math.min(1, cap / Math.max(im.width, im.height)); const c = mk(Math.round(im.width * k), Math.round(im.height * k)); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); return c; }
H.photo = im => { photoCv = toCv(im, 2400); storeImg('photo', photoCv); photoVer++; schedule(true); };
H.noPhoto = () => { photoCv = placeholderPhoto(); storeImg('photo', null); photoVer++; schedule(true); };
H.logo = im => { logoImg = trimImg(toCv(im, 1600)); storeImg('logo', logoImg); schedule(); };
H.logo2 = im => { logo2Img = im; storeImg('logo2', im); schedule(); };
H.noLogo2 = () => { logo2Img = null; storeImg('logo2', null); schedule(); };
H.reset3d = () => reset3d();
MONO.forEach(([k]) => { H['ic_' + k] = im => { icons[k] = trimImg(toCv(im, 400)); storeImg('ic_' + k, icons[k]); schedule(); }; });
H.noIcons = () => { MONO.forEach(([k]) => { delete icons[k]; storeImg('ic_' + k, null); }); schedule(); };

function syncCtl() { for (const k in ctl) ctl[k].set(S[k]); }
H.saveJson = () => { const o = {}; for (const k in DEF) if (k !== 'view' && k !== 'side') o[k] = S[k]; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o, null, 2)], { type: 'application/json' })); a.download = 'id-settings.json'; a.click(); };
H.loadJson = () => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json'; i.onchange = () => { const f = i.files[0]; if (!f) return; f.text().then(t => { try { const o = JSON.parse(t); for (const k in o) if (k in DEF && k !== 'view' && k !== 'side') S[k] = o[k]; syncCtl(); photoVer++; schedule(true); } catch (e) { alert('That file is not a settings file from this app.'); } }); }; i.click(); };
H.resetAll = () => { if (!confirm('Reset all settings and remove saved images?')) return; try { localStorage.removeItem(STORE_KEY); } catch (e) {} ['photo','logo','logo2','logo3','logo4','asset','bg','ownFront','ownBack'].concat(MONO.map(m => 'ic_' + m[0])).forEach(n => storeImg(n, null)); location.reload(); };
H.asset = im => { assetImg = im; storeImg('asset', im); schedule(); };
H.noAsset = () => { assetImg = null; storeImg('asset', null); schedule(); };
H.logo3 = im => { logo3Img = trimImg(toCv(im, 1200)); storeImg('logo3', logo3Img); schedule(); };
H.logo4 = im => { logo4Img = trimImg(toCv(im, 1200)); storeImg('logo4', logo4Img); schedule(); };
H.noSlots = () => { logo3Img = logo4Img = null; storeImg('logo3', null); storeImg('logo4', null); schedule(); };
H.bgImg = im => { bgCustom = im; storeImg('bg', im); setS('bgMode','custom'); schedule(true); };
H.noLogo = () => { logoImg = null; storeImg('logo', null); schedule(); };
H.shuffle = () => { S.seed = (S.seed * 7 + 13) % 997; schedule(true); };
H.ownFront = im => { ownFront = im; storeImg('ownFront', im); S.side = 'front'; schedule(); };
H.ownBack = im => { ownBack = im; storeImg('ownBack', im); schedule(); };
H.noOwn = () => { ownFront = ownBack = null; storeImg('ownFront', null); storeImg('ownBack', null); schedule(); };
function save(cv, name) { cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, 'image/png'); }
const EW = () => Math.round(BGW * S.scale), EH = () => Math.round(BGH * S.scale);
H.xFront = () => save(drawFront(EW(), EH()), `id-front-${EW()}x${EH()}.png`);
H.xBack = () => save(drawBack(EW(), EH()), `id-back-${EW()}x${EH()}.png`);
const mo = () => ({ mat: S.mat, finish: S.finish, slot: S.slot });
H.xMF = () => save(withBackdrop(makeMockup(drawFront(EW(), EH()), mo()).cv), `id-front-mockup-${S.mat}.png`);
H.xMB = () => save(withBackdrop(makeMockup(drawBack(EW(), EH()), mo()).cv), `id-back-mockup-${S.mat}.png`);
H.xMBoth = () => {
  const a = makeMockup(drawFront(EW(), EH()), mo()).cv, b = makeMockup(drawBack(EW(), EH()), mo()).cv, gap = Math.round(a.width * 0.04);
  const c = mk(a.width + b.width + gap, a.height), x = c.getContext('2d'); x.drawImage(a, 0, 0); x.drawImage(b, a.width + gap, 0);
  save(withBackdrop(c), `id-both-mockup-${S.mat}.png`);
};
function withBackdrop(cv) {
  const col = bdColor(); if (!col) return cv;
  const c = mk(cv.width, cv.height), x = c.getContext('2d'); x.fillStyle = col; x.fillRect(0, 0, c.width, c.height); x.drawImage(cv, 0, 0); return c;
}

/* ---------------- boot ---------------- */
const ready = Promise.all([
  new Promise(r => { bgImg.onload = r; bgImg.src = BG_SRC; }),
  Promise.all(['400 20px "IntraNet"','700 20px "IntraNet"','400 20px "IntraNet Outline"','400 20px "IntraNet Italic"','700 20px "Pixelify Sans"','400 20px Silkscreen','700 20px Silkscreen','700 20px "Chakra Petch"','400 20px "Space Grotesk"','700 20px "Space Grotesk"'].map(f => document.fonts.load(f))).catch(() => {})
]);
ready.then(() => loadImgs()).then(list => {
  (list || []).forEach(([k, im]) => { if (!im) return;
    if (k === 'photo') { photoCv = toCv(im, 2400); photoVer++; } else if (k === 'logo') logoImg = im; else if (k === 'logo2') logo2Img = im;
    else if (k === 'logo3') logo3Img = im; else if (k === 'logo4') logo4Img = im; else if (k === 'asset') assetImg = im; else if (k === 'bg') bgCustom = im;
    else if (k.startsWith('ic_')) icons[k.slice(3)] = im; else if (k === 'ownFront') ownFront = im; else if (k === 'ownBack') ownBack = im; });
}).then(() => update(1.5), () => update(1.5));
window.__ready = ready;
</script>
